<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Dashboard Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0f0f14;
      --surface:   #1a1a24;
      --surface2:  #22222f;
      --border:    rgba(255,255,255,0.07);
      --accent:    #6c63ff;
      --accent2:   #a78bfa;
      --green:     #22c55e;
      --red:       #ef4444;
      --gold:      #f59e0b;
      --text:      #f1f5f9;
      --text2:     #94a3b8;
      --radius:    16px;
    }
    body {
      font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, var(--accent) 0%, #8b5cf6 100%);
      padding: 20px 16px 20px; position: relative; overflow: hidden;
    }
    .header::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 80% 20%, rgba(255,255,255,.12) 0%, transparent 60%);
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; position: relative; }
    .store-badge, .role-badge {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
      padding: 4px 10px; border-radius: 20px;
    }
    .store-badge { background: rgba(255,255,255,.15); opacity: .85; }
    .role-badge { background: rgba(255,255,255,.2); }
    .header-name { font-size: 22px; font-weight: 800; margin-top: 14px; position: relative; }
    .header-sub { font-size: 13px; opacity: .75; margin-top: 4px; position: relative; }

    /* ── Tabs ── */
    .tabs {
      display: flex; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto;
    }
    .tab {
      flex: 1; padding: 13px 8px; text-align: center; font-size: 12px; font-weight: 600;
      color: var(--text2); cursor: pointer; border: none; background: none;
      border-bottom: 2px solid transparent; transition: all .2s; white-space: nowrap; min-width: 80px;
    }
    .tab.active { color: var(--accent2); border-bottom-color: var(--accent2); }
    .content { padding: 16px; }
    .section { display: none; }
    .section.active { display: block; }

    /* ── Cards & Grid ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
    }
    .card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; }
    .card-value { font-size: 28px; font-weight: 800; color: var(--text); }
    .card-value.green { color: var(--green); }
    .card-value.gold  { color: var(--gold); }
    .card-value.red  { color: var(--red); }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
    .stat-icon { font-size: 22px; margin-bottom: 8px; }
    .stat-label { font-size: 11px; color: var(--text2); font-weight: 500; }
    .stat-val { font-size: 18px; font-weight: 700; margin-top: 2px; }

    /* ── Lists (Transactions, Kasir, Consignment) ── */
    .row-item {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .row-title { font-size: 13px; font-weight: 600; }
    .row-sub { font-size: 11px; color: var(--text2); margin-top: 4px; }
    .row-right { font-size: 15px; font-weight: 700; color: var(--text); text-align: right; }
    .empty, .loading { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 13px;}

    /* ── Buttons ── */
    .btn-primary {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, var(--accent), #8b5cf6); color: white;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: all .2s;
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: white; padding: 10px 20px;
      border-radius: 20px; font-size: 13px; opacity: 0; pointer-events: none;
      transition: opacity 0.3s; z-index: 1000;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <span class="store-badge" id="store-badge">🏪 Toko</span>
      <span class="role-badge" id="role-badge">👤 Role</span>
    </div>
    <div class="header-name" id="header-name">Halo! 👋</div>
    <div class="header-sub" id="header-sub">Dashboard</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="ringkasan">📊 Ringkasan</button>
    <button class="tab" data-tab="stok">📦 Stok</button>
    <button class="tab" data-tab="transaksi">🧾 Transaksi</button>
    <button class="tab owner-only" data-tab="kasir" style="display:none">👥 Kasir</button>
  </div>

  <div class="content" id="dashboard-content">
    
    <!-- TAB: RINGKASAN -->
    <div class="section active" id="tab-ringkasan">
      <div class="card">
        <div class="card-label">Penjualan Hari Ini</div>
        <div class="card-value green" id="today-revenue">Rp0</div>
      </div>
      <div class="stat-grid" style="margin-bottom:12px">
        <div class="stat-card">
          <div class="stat-icon">🛒</div>
          <div class="stat-label">Transaksi Harian</div>
          <div class="stat-val" id="today-count">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">🏷️</div>
          <div class="stat-label">Diskon Harian</div>
          <div class="stat-val" id="today-discount">Rp0</div>
        </div>
      </div>
      
      <div class="card owner-only" id="month-card" style="display:none">
        <div class="card-label">Penjualan Bulan Ini</div>
        <div class="card-value gold" id="month-revenue">Rp0</div>
      </div>

      <div class="card">
        <div class="card-label">Top 5 Produk (7 Hari)</div>
        <div id="top-products-list">Loading...</div>
      </div>
    </div>

    <!-- TAB: STOK -->
    <div class="section" id="tab-stok">
      <div class="stat-grid" style="margin-bottom:12px">
        <div class="stat-card">
          <div class="stat-icon">📦</div>
          <div class="stat-label">Total Jenis Produk</div>
          <div class="stat-val" id="total-products">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⚠️</div>
          <div class="stat-label">Stok Rendah/Habis</div>
          <div class="stat-val green" id="low-stock">0</div>
        </div>
      </div>

      <div class="card">
        <div class="card-label">Ringkasan per Kategori</div>
        <canvas id="stockChart" width="100" height="60"></canvas>
      </div>

      <div class="card">
        <div class="card-label">Produk Titipan (Konsinyasi)</div>
        <div id="consignment-list">Loading...</div>
      </div>
    </div>

    <!-- TAB: TRANSAKSI -->
    <div class="section" id="tab-transaksi">
      <div id="trx-list"><div class="loading">Loading...</div></div>
    </div>

    <!-- TAB: KASIR (Owner Only) -->
    <div class="section" id="tab-kasir">
      <button class="btn-primary" id="btn-gen-token" style="margin-bottom:12px">⚡ Tambah Kasir (Buat Token)</button>
      <div id="kasir-list"><div class="loading">Loading...</div></div>
    </div>

  </div>
  
  <div class="toast" id="toast"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready(); tg.expand(); tg.setHeaderColor('#0f0f14'); tg.setBackgroundColor('#0f0f14');
    const initData = tg.initData;
    // Use current origin so it automatically points to the ngrok URL
    const API_BASE = window.location.origin;
    const headers = { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData };
    
    function fmtRp(n) { return 'Rp' + Number(n).toLocaleString('id-ID'); }
    function showToast(msg, ms = 2000) {
      const el = document.getElementById('toast');
      el.textContent = msg; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), ms);
    }

    // Tab switcher
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'transaksi') loadTransaksi();
        if (btn.dataset.tab === 'kasir') loadKasir();
      });
    });

    async function loadRingkasan() {
      try {
        const res = await fetch(API_BASE + '/api/mini/dashboard', { headers });
        const data = await res.json();
        
        document.getElementById('store-badge').textContent = '🏪 ' + (data.store_name || 'Toko');
        document.getElementById('role-badge').textContent = data.role === 'owner' ? '👑 Owner' : '👤 Kasir';
        document.getElementById('header-name').textContent = 'Halo, ' + (data.full_name || 'User') + '! 👋';
        
        if (data.role === 'owner') {
          document.querySelectorAll('.owner-only').forEach(el => el.style.display = '');
        }

        const t = data.today;
        document.getElementById('today-revenue').textContent = fmtRp(t.total_revenue);
        document.getElementById('today-count').textContent = t.total_transactions;
        document.getElementById('today-discount').textContent = fmtRp(t.total_discount);

        if (data.month_revenue !== null) {
          document.getElementById('month-revenue').textContent = fmtRp(data.month_revenue);
          document.getElementById('month-card').style.display = '';
        }
        
        if (data.stock) {
          document.getElementById('total-products').textContent = data.stock.total_products;
          const ls = document.getElementById('low-stock');
          ls.textContent = data.stock.low_stock;
          if (data.stock.low_stock > 0) {
            ls.classList.remove('green'); ls.classList.add('red');
          }
        }
      } catch(e) {}
    }

    async function loadTopProducts() {
      const list = document.getElementById('top-products-list');
      try {
        const res = await fetch(API_BASE + '/api/mini/top-products', { headers });
        const data = await res.json();
        if(!data.length) return list.innerHTML = '<div class="empty">Belum ada data penjualan.</div>';
        list.innerHTML = data.map((t, i) => `
          <div class="row-item">
            <div><div class="row-title">#${i+1} ${t.product_name}</div></div>
            <div class="row-right" style="color:var(--accent2)">${t.quantity} x</div>
          </div>
        `).join('');
      } catch(e) { list.innerHTML = '<div class="empty">Gagal memuat.</div>'; }
    }

    async function loadConsignment() {
      const list = document.getElementById('consignment-list');
      try {
        const res = await fetch(API_BASE + '/api/mini/consignment', { headers });
        const data = await res.json();
        if(!data.length) return list.innerHTML = '<div class="empty">Tidak ada produk konsinyasi.</div>';
        list.innerHTML = data.map(t => `
          <div class="row-item">
            <div>
              <div class="row-title">🤝 ${t.name}</div>
              <div class="row-sub">Supplier: ${t.supplier}</div>
            </div>
            <div class="row-right" style="font-size:12px; font-weight:normal">Stok: <b>${t.stock}</b></div>
          </div>
        `).join('');
      } catch(e) { list.innerHTML = '<div class="empty">Gagal memuat.</div>'; }
    }

    async function loadStockChart() {
      try {
        const res = await fetch(API_BASE + '/api/mini/stock-summary', { headers });
        const data = await res.json();
        const ctx = document.getElementById('stockChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: data.map(d => d.category),
            datasets: [{
              label: 'Total Stok',
              data: data.map(d => d.total_stock),
              backgroundColor: '#6c63ff',
              borderRadius: 4
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } },
              x: { grid: { display: false } }
            }
          }
        });
      } catch(e) {}
    }

    async function loadTransaksi() {
      const list = document.getElementById('trx-list');
      try {
        const res = await fetch(API_BASE + '/api/mini/transactions?limit=20', { headers });
        const data = await res.json();
        if (!data.transactions.length) return list.innerHTML = '<div class="empty">Belum ada transaksi.</div>';
        list.innerHTML = data.transactions.map(t => `
          <div class="row-item">
            <div>
              <div class="row-title">${t.invoice_no}</div>
              <div class="row-sub">${t.payment_method}</div>
            </div>
            <div class="row-right" style="color:var(--green)">${fmtRp(t.grand_total)}</div>
          </div>
        `).join('');
      } catch(e) { list.innerHTML = '<div class="empty">Gagal memuat.</div>'; }
    }

    // Init Calls
    loadRingkasan();
    loadTopProducts();
    loadConsignment();
    loadStockChart();
  </script>
</body>
</html>
